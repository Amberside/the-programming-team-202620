<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Destination</title>
    <!--Link the style sheet-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <!--Link the style sheet-->  
  <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

  <!--Navbar placeholder-->
    <span id="navbar-placeholder"></span>

    <!-- Image Gallery Section -->
        <section class="mb-5">
            <div class="row g-3">
                <div class="col-md-4">
                    <img src="img/germany-alps-castle-nature-preview.jpg" alt="German alps" class="img-fluid rounded shadow-sm w-100" style="height: 200px; object-fit: cover;">
                </div>
                <div class="col-md-4">
                    <img src="img/Gothic_Quarter,_Barcelona,_Spain_-_panoramio_(4).jpg" alt="Barcelona old churches" class="img-fluid rounded shadow-sm w-100" style="height: 200px; object-fit: cover;">
                </div>
                <div class="col-md-4">
                    <img src="img/porto-pt-v3.jpg" alt="Porto's colorful coastline" class="img-fluid rounded shadow-sm w-100" style="height: 200px; object-fit: cover;">
                </div>
            </div>
        </section>

  <div class="list-container">
<div class="image-container">

    
        <!-- Form Card Section -->
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-md-8">
                <div class="card custom-form-card h-100 shadow-sm border-0">
                    <div class="card-body p-4 d-flex flex-column">
                        <h2 class="card-title fw-bold text-center mb-4">Share Your Recommendation</h2>
                        
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">Your Name</label>
                                <input type="text" class="form-control custom-input" id="name" placeholder="Enter your name" autocomplete="name">
                            </div>
                            <div class="mb-3">
                                <label for="spot" class="form-label">Destination</label>
                                <input type="text" class="form-control custom-input" id="spot" placeholder="e.g., Paris">
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Why do you love it?</label>
                                <textarea class="form-control custom-input" id="message" rows="4" placeholder="Tell me why its your favourite destination"></textarea>
                            </div>
                            <div class="text-center mt-3">
                                <button type="submit" class="btn btn-primary custom-btn w-50">Submit Recommendation</button>
                            </div>
                        </form>

<!--Bootstrap Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <!--Navbar Script-->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>
</body>
</html>
