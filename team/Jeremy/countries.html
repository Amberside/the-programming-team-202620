<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--Link the style sheet-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <!--Link the style sheet-->  
    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<!--Navbar placeholder-->
<span id="navbar-placeholder"></span>

<!-- Image Gallery Section -->
        <section class="mb-5">
            <div class="row g-3">
                <div class="col-md-4">
                    <img src="img/germany-alps-castle-nature-preview.jpg" alt="German alps" class="img-fluid rounded shadow-sm w-100" style="height: 200px; object-fit: cover;">
                </div>
                <div class="col-md-4">
                    <img src="img/Gothic_Quarter,_Barcelona,_Spain_-_panoramio_(4).jpg" alt="Barcelona old churches" class="img-fluid rounded shadow-sm w-100" style="height: 200px; object-fit: cover;">
                </div>
                <div class="col-md-4">
                    <img src="img/porto-pt-v3.jpg" alt="Porto's colorful coastline" class="img-fluid rounded shadow-sm w-100" style="height: 200px; object-fit: cover;">
                </div>
            </div>
        </section>

<div class="list-container">
<div class="image-container">

    <div class="container my-4">
    <div class="row g-4 mb-4">
        <!-- Countries Visited Column -->
        <div class="col-md-6">
            <div class="card h-100 shadow-sm border-0 p-3">
                <h2 class="h4 mb-3 text-primary">&#127757; Countries Visited</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Portugal</li>
                    <li class="list-group-item">Germany</li>
                    <li class="list-group-item">Spain</li>
                    <li class="list-group-item">Hungary</li>
                </ul>
            </div>
        </div>

        <!-- Next Destinations Column -->
        <div class="col-md-6">
            <div class="card h-100 shadow-sm border-0 p-3">
                <h2 class="h4 mb-3 text-success">&#9992;&#65039; Next Destinations</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Japan</li>
                    <li class="list-group-item">Peru</li>
                </ul>
            </div>
        </div>
    </div>
<button id="explore-btn" class="btn btn-outline-primary btn-sm">
    If you have visited one of these countries hit the button!<span id="counter" class="badge bg-primary">0</span>
</button>

<!--Bootstrap Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <!--Navbar Script-->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>
<script src="js/script.js"></script>    
</body>
</html>
