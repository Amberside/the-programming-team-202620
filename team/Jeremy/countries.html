<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--Link the style sheet-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <!--Link the style sheet-->  
    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

<!--Navbar placeholder-->
<span id="navbar-placeholder"></span>

    <div class="container my-4">
    <div class="row g-4 mb-4">
        <!-- Countries Visited Column -->
        <div class="col-md-6">
            <div class="card h-100 shadow-sm border-0 p-3">
                <h2 class="h4 mb-3 text-primary">&#127757; Countries Visited</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Portugal</li>
                    <li class="list-group-item">Germany</li>
                    <li class="list-group-item">Spain</li>
                    <li class="list-group-item">Hungary</li>
                </ul>
            </div>
        </div>

        <!-- Next Destinations Column -->
        <div class="col-md-6">
            <div class="card h-100 shadow-sm border-0 p-3">
                <h2 class="h4 mb-3 text-success">&#9992;&#65039; Next Destinations</h2>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Japan</li>
                    <li class="list-group-item">Peru</li>
                </ul>
            </div>
        </div>
    </div>


    <!--Bootstrap Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <!--Navbar Script-->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>
    
</body>
</html>
